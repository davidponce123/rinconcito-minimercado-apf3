spring.application.name=rinconcito-minimercado
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rinconcito}
spring.datasource.username=${DB_USER:rinconcito_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.sql.init.mode=never
logging.level.root=INFO
logging.level.pe.utp.rinconcito=INFO
