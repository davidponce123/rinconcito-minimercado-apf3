<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepciones | Rinconcito</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/dashboard}"><span class="brand-symbol">R</span>Rinconcito <small>MINIMERCADO</small></a><div class="user"><span th:text="${#authentication.name}">Usuario</span><form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="logout">Salir</button></form></div></header><div class="layout"><aside th:replace="~{fragments/sidebar :: sidebar}"></aside><main><div class="eyebrow">SISTEMA / RECEPCIONES</div><div class="heading"><div><h1>Recepciones</h1><p>Entradas de mercadería, guías y proveedores.</p></div></div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="actions"><a class="btn primary" th:href="@{/receipts/new}">＋ Registrar recepción</a></div><section class="panel"><h2>Últimas recepciones</h2><table><thead><tr><th>ID</th><th>Guía</th><th>Proveedor</th><th>Fecha</th><th>Estado</th></tr></thead><tbody><tr th:each="r:${items}"><td th:text="${r.id_ingreso}"></td><td th:text="${r.guia}"></td><td th:text="${r.proveedor}"></td><td th:text="${r.fecha}"></td><td><span class="chip good" th:text="${r.estado}"></span></td></tr></tbody></table></section><footer>Rinconcito Minimercado · Implementación académica APF3 · Seguridad y transacciones del lado del servidor</footer></main></div><script th:src="@{/js/app.js}"></script></body></html>
