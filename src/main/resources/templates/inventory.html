<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inventario | Rinconcito</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <header class="topbar"><a class="brand" th:href="@{/dashboard}"><span class="brand-symbol">R</span>Rinconcito
            <small>MINIMERCADO</small></a>
        <div class="user"><span th:text="${#authentication.name}">Usuario</span>
            <form method="post" th:action="@{/logout}"><input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"><button class="logout">Salir</button></form>
        </div>
    </header>
    <div class="layout">
        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
        <main>
            <div class="eyebrow">SISTEMA / INVENTARIO</div>
            <div class="heading">
                <div>
                    <h1>Inventario</h1>
                    <p>Stock derivado de entradas y salidas confirmadas.</p>
                </div>
            </div>
            <div class="alert success" th:if="${success}" th:text="${success}"></div>
            <div class="alert error" th:if="${error}" th:text="${error}"></div>
            <div class="actions"><a th:if="${isAdmin}" class="btn" th:href="@{/reports}">⇩ Exportar a Excel</a></div>
            <section class="panel">
                <h2>Existencias por producto</h2>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Stock</th>
                                <th>Mínimo</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s:${items}">
                                <td th:text="${s.productId}"></td>
                                <td th:text="${s.name}"></td>
                                <td th:text="${s.quantity}"></td>
                                <td th:text="${s.minimum}"></td>
                                <td><span class="chip" th:classappend="${s.needsReorder()} ? ' warning' : ' good'"
                                        th:text="${s.needsReorder()} ? 'Reponer' : 'Correcto'"></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
            <footer>Rinconcito Minimercado · Implementación académica APF3 · Seguridad y transacciones del lado del
                servidor</footer>
        </main>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
